# Plantilla de Nginx: el contenedor sustituye ${API_HOST} y ${NGINX_LOCAL_RESOLVERS}
# al arrancar (docker-entrypoint.d/20-envsubst-on-templates.sh).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # El nombre de la API se resuelve en cada petición: Nginx arranca aunque
    # salud-api-prod aún no exista o el DNS tarde en responder.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    # Los entornos Express no admiten HTTP: la API se llama por HTTPS (con SNI).
    set $api_upstream ${API_SCHEME}://${API_HOST};
    proxy_ssl_server_name on;

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /health/ready {
        proxy_pass $api_upstream/api/v1/health;
        proxy_set_header Host ${API_HOST};
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass $api_upstream;
        # El ingress interno de Container Apps enruta por Host.
        proxy_set_header Host ${API_HOST};
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Los assets llevan hash en el nombre: nunca deben caer en el fallback SPA,
    # o un archivo ausente se serviría como HTML con 200 y rompería estilos y scripts.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
}
